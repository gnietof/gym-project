<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Assistant (Audit)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="../static/css/base.css"
    />
  </head>

  <body>
    <div id="nav-placeholder" data-tab=""welcome"></div>    

       <div class="container py-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-10">
                
                <div class="card shadow-sm border-light p-1 p-sm-2 bg-white rounded-4">
                    
                    <div class="mb-4">
                        <a href="./requests" class="back-link d-inline-flex align-items-center gap-2 text-decoration-none text-secondary small fw-medium">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                            Back to List
                        </a>
                    </div>

                    <div class="mb-4 d-flex justify-content-between align-items-start border-b pb-3">
                        <div>
                            <h1 class="h4 fw-bold text-dark m-0">Request Details</h1>
                        </div>
                        <span id='score' class="badge border px-3 py-2 rounded-pill fw-semibold hidden"></span>                     
                    </div>

                    <div class="row g-1">
                        <div class="col-6">
                            <div class="bg-light p-3 border border-light">
                                <div class="detail-label text-muted fw-bold mb-1">Session Id</div>
                                <div id='session' class="detail-value font-monospace fw-bold text-primary"></div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-light p-3 border border-light">
                                <div class="detail-label text-muted fw-bold mb-1">Track Id</div>
                                <div id='track' class="detail-value font-monospace fw-bold text-primary"></div>
                            </div>
                        </div>
                        <div class="col-12 col-sm-4">
                            <div class="border-bottom pb-2">
                                <div class="detail-label text-muted fw-semibold mb-1">Timestamp</div>
                                <div id="timestamp" class="detail-value fw-medium"></div>
                            </div>
                        </div>
                        <div class="col-12 col-sm-4">
                            <div class="border-bottom pb-2">
                                <div class="detail-label text-muted fw-semibold mb-1">Model</div>
                                <div id="model" class="detail-value fw-medium"></div>
                            </div>
                        </div>
                        <div class="col-12 col-sm-4">
                            <div class="border-bottom pb-2">
                                <div class="detail-label text-muted fw-semibold mb-1">Total Tokens</div>
                                <div id="tokens" class="detail-value fw-medium"></div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div>
                                <div class="detail-label text-muted fw-semibold mb-2">Messages Sent</div>
                                <pre id='messages_sent' class="text-wrap text-break mw-100 p-3 bg-light rounded-3 small custom-resizable" >
                                </pre>
                            </div>
                        </div>
                        <div class="col-12">
                            <div>
                                <div class="detail-label text-muted fw-semibold mb-2">Response</div>
                                <pre id='response_received' class="text-wrap text-break overflow-auto mw-100 p-3 bg-light rounded-3 small custom-resizable" >
                                </pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const path = window.location.pathname; 
        const urlParams = new URLSearchParams(window.location.search);
        const track = urlParams.get('track'); 
        if (track) {

          const response = await fetch(`/usage/requests/${track}`, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
            },
          });

          const data = await response.json();
          document.getElementById('session').innerText = data.session;
          document.getElementById('track').innerText = track;
          document.getElementById('timestamp').innerText = data.timestamp;
          document.getElementById('model').innerText = data.model;
          document.getElementById('tokens').innerText = data.total_tokens;
          document.getElementById('messages_sent').innerText = JSON.stringify(data.messages_sent,"\t",2).replaceAll('\\n', '\n');
          document.getElementById('response_received').innerText = JSON.stringify(data.response_received,"\t",2).replaceAll('\\n', '\n');
          score = document.getElementById('score');
          if (data.score=='U') {
            score.innerText = "Approved"
            score.classList.add("badge-pill-approved");
            score.classList.remove("hidden");
          }
          if (data.score=='D') {
            score.innerText = "Rejected"
            score.classList.add("badge-pill-rejected");
            score.classList.remove("hidden");
          }
        }

      });
    </script>
  </body>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js"   integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="   crossorigin="anonymous"></script>
  <script src="../static/js/main.js"></script>    
</html>
