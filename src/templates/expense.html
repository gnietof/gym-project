<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Assistant (Expenses)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/base.css') }}"
    />
  </head>

  <body>
    <div id="nav-placeholder" data-tab=""welcome"></div>    
    <div class="row flex-grow-1 g-3 mb-3">
        <div class="col-md-6">    
          <canvas id="total_tokens"></canvas>
        </div>
        <div class="col-md-6">    
          <canvas id="detail_tokens"></canvas>
        </div>
    </div>
    <div class="row flex-grow-1 g-3">
        <div class="col-md-6">    
          <canvas id="model_tokens"></canvas>
        </div>
        <div class="col-md-6">    
          <canvas id="total_requests"></canvas>
        </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const response = await fetch("/usage/tokens", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        });

        const data = await response.json();
        total_tokens("total_tokens", data);
        detail_tokens("detail_tokens", data);
        model_tokens("model_tokens", data);
        total_requests("total_requests", data);

      });

    </script>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js"   integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="   crossorigin="anonymous"></script>
  <script src="../static/js/main.js"></script>    
  <script src="../static/js/charts.js"></script>    
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
</html>
