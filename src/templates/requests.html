<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Assistant (Audit)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="../static/css/base.css"
    />
  </head>

  <body>
    <div id="nav-placeholder" data-tab=""welcome"></div>    
    <div class="row flex-grow-1 g-3 mt-3">
        <div id="placeholder" class="col-md-12 data-table">    
        </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const response = await fetch("/usage/requests", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        });

        columns = [
          { field: "timestamp", label: "Time" },
          { field: "tag", label: "Tag" },
          { field: "session", label: "Session" },
          { field: "track", label: "Track", link: "./request" },
          { field: "prompt_tokens", label: "Prompt" },
          { field: "completion_tokens", label: "Completion" },
          { field: "total_tokens", label: "Total" },
          { field: "score", clazz: {"U":"row-approved","D":"row-rejected"} }
        ]

        const data = await response.json();
        create_table("placeholder",columns,data);
      });

    </script>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js"   integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="   crossorigin="anonymous"></script>
  <script src="../static/js/main.js"></script>    
  <script src="../static/js/tables.js"></script>    
</html>
