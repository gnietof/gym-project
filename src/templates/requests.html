<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Assistant (Audit)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/base.css') }}"
    />
  </head>

  <body>
    <div id="nav-placeholder" data-tab=""welcome"></div>    
    <div class="row flex-grow-1 g-3 mt-3">
        <!-- <div class="col-md-12" id="placeholder" style="max-height: calc(100vh - 60px); overflow-y: auto;">     -->
        <div id="placeholder" class="col-md-12 data-table">    
        </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const response = await fetch("/usage/requests", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        });

        columns = [
          ['timestamp','Time'],
          ['track','Track Id'],
          ['prompt_tokens','Prompt Tokens'],
          ['completion_tokens','Completion Tokens'],
          ['total_tokens','Total Tokens'],
          ['score','Score']
        ]

        const data = await response.json();
        const table = document.createElement("table");
        table.classList.add("table","table-striped","table-hover","align-middle","mb-0");
        const thead = document.createElement("thead");
        thead.classList.add("sticky-top");
        const tr = document.createElement("tr");
        columns.forEach(column => {
          const th = document.createElement("th");
          th.textContent=column[1];
          tr.append(th);
        });
        thead.append(tr);
        table.append(thead);

        const tbody = document.createElement("tbody");
        data.forEach(request => {
          const tr = document.createElement("tr");
          columns.forEach(column => {
            const td = document.createElement("td");
            td.textContent = request[column[0]];
            tr.append(td);
          });
          tbody.append(tr);
        });
        table.append(tbody);
        document.getElementById("placeholder").append(table);

      });

    </script>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js"   integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="   crossorigin="anonymous"></script>
  <script src="../static/js/main.js"></script>    
</html>
